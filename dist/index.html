<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18191c">
  <meta name="description" content="Posicione, dimensione e gire estampas PNG ou SVG em camisetas 3D.">
  <title>doutelab · Estúdio 3D</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="wordmark"><b>doutelab</b></div>
    <h1>Estúdio 3D</h1>
    <a class="studio-link" href="./mockups.html">Mockups</a>
  </header>
  <main class="workspace">
    <section class="viewer" aria-label="Visualização da camiseta">
      <div class="viewer-bar">
        <div class="segments" role="group" aria-label="Visualização da camiseta">
          <button type="button" data-view="front" aria-pressed="true">Frente</button>
          <button type="button" data-view="back" aria-pressed="false">Costas</button>
          <button type="button" data-view="quarter" aria-pressed="false" aria-label="Três quartos" title="Vista de três quartos">¾</button>
        </div>
        <div class="viewer-actions">
          <button id="undo" class="tool-button" title="Desfazer o último ajuste" type="button" disabled>Desfazer</button>
          <button id="preview" class="tool-button" aria-pressed="false" title="Ocultar as alças e inspecionar a estampa" type="button">Prévia</button>
        </div>
      </div>
      <div class="viewport">
        <div id="scene" class="scene">
          <div id="transform" class="transform" role="group" aria-label="Alças da estampa" hidden>
            <canvas id="selection" aria-hidden="true"></canvas>
            <button type="button" class="handle corner" data-gesture="scale" data-x="-1" data-y="1" aria-label="Redimensionar pelo canto superior esquerdo" title="Arraste para redimensionar"></button>
            <button type="button" class="handle corner" data-gesture="scale" data-x="1" data-y="1" aria-label="Redimensionar pelo canto superior direito" title="Arraste para redimensionar"></button>
            <button type="button" class="handle corner" data-gesture="scale" data-x="1" data-y="-1" aria-label="Redimensionar pelo canto inferior direito" title="Arraste para redimensionar"></button>
            <button type="button" class="handle corner" data-gesture="scale" data-x="-1" data-y="-1" aria-label="Redimensionar pelo canto inferior esquerdo" title="Arraste para redimensionar"></button>
            <button type="button" class="handle rotate" data-gesture="rotate" aria-label="Girar estampa" title="Arraste para girar a estampa"></button>
            <button type="button" class="handle move" data-gesture="move" aria-label="Mover estampa" title="Arraste a estampa para mover"></button>
          </div>
        </div>
        <p id="graphics-error" class="graphics-error" role="alert" hidden></p>
      </div>
      <div class="viewer-footer">
        <p id="hint">Arraste a arte pra mover, os cantos pra ampliar e a alça redonda pra girar.</p>
        <p id="transform-status"></p>
      </div>
    </section>

    <aside class="inspector" aria-label="Propriedades">
      <h2 class="inspector-title">Propriedades</h2>
      <section class="panel" aria-labelledby="garment-title">
        <h3 id="garment-title">Camiseta</h3>
        <label class="model-field" for="model"><span>Modelo</span>
          <span class="select-wrap"><select id="model">
          </select></span>
        </label>
        <div class="fabric-field">
          <span id="color-label">Tecido</span>
          <div class="colors" role="group" aria-labelledby="color-label">
            <div id="fabric-swatches" class="colors"></div>
            <label class="custom-color" title="Escolher outra cor"><span aria-hidden="true">+</span><input id="color" type="color" value="#dedbd2" aria-label="Escolher outra cor de tecido"></label>
          </div>
        </div>
        <p class="fabric-reference"><span id="fabric-name"></span> <a id="fabric-source" target="_blank" rel="noopener">Ver na Zimm</a></p>
      </section>
      <section class="panel art-panel" aria-labelledby="print-title">
        <div class="art-heading">
          <h3 id="print-title">Estampa</h3><span id="active-face">Frente</span>
        </div>
        <label id="dropzone" class="dropzone">
          <input id="art-file" type="file" accept=".png,.svg,image/png,image/svg+xml" aria-label="Escolher arquivo PNG ou SVG">
          <span aria-hidden="true" class="upload-symbol">+</span><strong id="upload-label">Importar PNG ou SVG</strong>
        </label>
        <p id="file-error" class="file-error" role="alert" hidden></p>
        <div id="file-card" class="file-card" hidden>
          <img id="art-thumb" alt="" width="34" height="34">
          <span class="file-info"><span id="file-name" aria-live="polite"></span><small id="file-kind"></small></span>
          <button class="remove-button" id="remove-art" aria-label="Remover estampa" title="Remover estampa" type="button">×</button>
        </div>
        <div id="art-properties" class="art-properties" hidden>
          <div id="svg-properties" class="property-row" hidden>
            <label for="art-color">Cor do SVG</label>
            <div class="color-actions">
              <button id="original-color" type="button" class="tool-button" aria-pressed="true">Original</button>
              <input id="art-color" type="color" value="#ff665a" aria-label="Nova cor do SVG" title="Recolorir o SVG">
            </div>
          </div>
          <div class="property-row opacity-row">
            <label for="opacity">Opacidade</label>
            <input id="opacity" type="range" value="100" min="0" max="100">
            <output id="opacity-value" for="opacity">100%</output>
          </div>
          <div class="property-actions">
            <button id="flip" class="tool-button" type="button" aria-pressed="false">Espelhar</button>
            <button id="send-to-mockups" class="tool-button" type="button">Criar mockup</button>
            <button id="reset-print" class="tool-button" type="button">Redefinir</button>
          </div>
        </div>
      </section>
      <section class="panel export-panel" aria-labelledby="export-title">
        <h3 id="export-title">Baixar mockup</h3>
        <button class="tool-button export-primary" type="button" data-export="png" disabled>PNG da vista atual</button>
        <div class="export-formats">
          <button class="tool-button" type="button" data-export="gif" title="Giro no eixo X em 2,8 s" disabled>GIF · 2,8 s</button>
          <button class="tool-button" type="button" data-export="zip" title="Cinco ângulos na mesma inclinação" disabled>ZIP · 5 PNGs</button>
        </div>
        <p id="export-status" role="status"></p>
        <a id="export-download" hidden></a>
      </section>
    </aside>
  </main>
</body>
</html>
